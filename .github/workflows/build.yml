name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        run: zsh build.sh
      - name: Test classification and legacy history
        run: Porta.app/Contents/MacOS/Porta --category-self-test
